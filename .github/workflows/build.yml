name: CI

on:
  push:
    branches:
      - 'main'
      - 'net10-only'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'false'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 10.0 はライブラリのビルド用、8.0 は NUKE ビルドプロジェクトの実行用。
          # Nuke.Common 6.3.0 が BinaryFormatter を使うため net10.0 では動かない。
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Validation Checks
        run: ./build.sh ValidateSolution
      - name: Test
        # Clean / Restore / Compile を飛ばす。dotnet test が必要な分だけビルドする。
        run: ./build.sh Test --skip Clean Restore Compile
      - name: Pack
        run: ./build.sh Pack --configuration Release --msbuild-properties ContinuousIntegrationBuild=true
      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: "build/output_packages/*nupkg"
          if-no-files-found: error
          retention-days: 7

  Publish:
    name: Publish to NuGet
    needs: [Build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # 必要なら GitHub 側でこの environment に承認を設定して公開を止められる。
    environment: nuget
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'false'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: build/output_packages
      - name: Verify tag matches package version
        run: |
          packed=$(ls build/output_packages/Promete.Silk.Core.*.nupkg \
            | sed -E 's#.*/Promete\.Silk\.Core\.(.+)\.nupkg$#\1#')
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag packed=$packed"
          if [ "$tag" != "$packed" ]; then
            echo "::error::タグ ($tag) とパッケージのバージョン ($packed) が一致しません。common.props の SilkForkVersion を確認してください。"
            exit 1
          fi
      - name: Push to NuGet
        run: >-
          ./build.sh PushToNuGet
          --skip Clean Restore Compile Pack
          --nuget-api-key ${{ secrets.NUGET_API_KEY }}
