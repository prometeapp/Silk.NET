name: Bindings Regeneration

on:
  #schedule: - disabled for now
  #  - cron: '0 0 * * Fri'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: windows-quick

    steps:
    - uses: actions/checkout@v2
      with:
        token: ${{ secrets.PUSHABLE_GITHUB_TOKEN }}
    - name: Checkout submodules, configure git.
      run: |
          # Keep this in sync with generator.json!
          git -c submodule.third_party/git-hooks.update=none submodule update --init --depth 0 build/submodules/SDL
          git config --local user.email "9011267+dotnet-bot@users.noreply.github.com"
          git config --local user.name "The Silk.NET Automaton"
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # 10.0 builds the libraries; 8.0 hosts the NUKE build project.
        dotnet-version: |
          8.0.x
          10.0.x
    - uses: GuillaumeFalourd/setup-windows10-sdk-action@v1.9
      name: Setup Windows 11 SDK
      with:
        sdk-version: 22621
    - name: Run a full run of BuildTools
      run: ./build.cmd regenerate-bindings --create-bindings-pr
      env:
        PUSHABLE_GITHUB_TOKEN: ${{ secrets.PUSHABLE_GITHUB_TOKEN }}
